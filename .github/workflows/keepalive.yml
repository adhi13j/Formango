# Free Supabase projects pause after about a week without use. This pings the database once a week
# so the project stays awake. It reads only: the public forms table answers an empty list.
name: keep-alive
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            "${{ vars.SUPABASE_URL }}/rest/v1/forms?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" > /dev/null
